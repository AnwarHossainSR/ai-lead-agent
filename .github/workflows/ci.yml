name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'issue_comment' ||
      github.event.comment.body == '/test'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'issue_comment' ||
      github.event.comment.body == '/test'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'issue_comment' ||
      github.event.comment.body == '/test'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event.comment.body == '/test'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mela
          POSTGRES_PASSWORD: mela_test
          POSTGRES_DB: mela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mela:mela_test@localhost:5432/mela_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        run: pnpm --filter @mela/database db:migrate
      - name: Run database tests
        run: pnpm --filter @mela/database test
      - name: Run config tests
        run: pnpm --filter @mela/config test
      - name: Run shared tests
        run: pnpm --filter @mela/shared test
      - name: Run API tests
        run: pnpm --filter @mela/api test
