name: CI

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  should-run:
    name: Should run
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - id: filter
        run: |
          BODY="${{ github.event.issue.title }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            BODY="${{ github.event.comment.body }}"
          fi

          if echo "$BODY" | grep -qE '(^|[^a-zA-Z0-9])/test([^a-zA-Z0-9]|$)'; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
          fi

  # issue_comment runs execute against the PR head via `ref:` on checkout, but
  # GitHub still attaches check runs to github.sha (the default branch HEAD for
  # issue_comment events). Resolve the PR's real head SHA here and post a
  # pending commit status to it so the PR page actually shows this run.
  pr-sha:
    name: Resolve PR head SHA
    needs: should-run
    if: needs.should-run.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          else
            sha="${{ github.event.pull_request.head.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Report pending status to PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.sha.outputs.sha }}" \
            -f state="pending" \
            -f context="CI / required" \
            -f description="lint, typecheck, build and test running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: should-run
    if: ${{ needs.should-run.outputs.run-tests == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: should-run
    if: ${{ needs.should-run.outputs.run-tests == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: should-run
    if: ${{ needs.should-run.outputs.run-tests == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: should-run
    if: ${{ needs.should-run.outputs.run-tests == 'true' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mela
          POSTGRES_PASSWORD: mela_test
          POSTGRES_DB: mela
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mela:mela_test@localhost:5432/mela
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Run migrations
        run: pnpm --filter @mela/database db:migrate
      - name: Run database tests
        run: pnpm --filter @mela/database test
      - name: Run config tests
        run: pnpm --filter @mela/config test
      - name: Run shared tests
        run: pnpm --filter @mela/shared test
      - name: Run API tests
        run: pnpm --filter @mela/api test
      - name: Run web tests
        run: pnpm --filter @mela/web exec vitest run

  report-status:
    name: Report status
    needs: [should-run, pr-sha, lint, typecheck, build, test]
    if: always() && needs.should-run.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine roll-up result
        id: rollup
        run: |
          set -euo pipefail
          state=success
          for r in "${{ needs.lint.result }}" "${{ needs.typecheck.result }}" "${{ needs.build.result }}" "${{ needs.test.result }}"; do
            if [ "$r" != "success" ]; then
              state=failure
            fi
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Report final status to PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ needs.pr-sha.outputs.sha }}" \
            -f state="${{ steps.rollup.outputs.state }}" \
            -f context="CI / required" \
            -f description="Roll-up of lint, typecheck, build and test jobs" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail run if any job failed
        if: steps.rollup.outputs.state == 'failure'
        run: exit 1
