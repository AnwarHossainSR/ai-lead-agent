packages:
  - "apps/*"
  - "packages/*"

# Dependency install scripts are blocked by default.
#   esbuild, @swc/core  — native compilers whose postinstall does one thing:
#                         link the prebuilt binary for this platform. Without
#                         it the tool has no executable at all.
#   protobufjs          — postinstall only checks a version-scheme convention
#                         between it and its dependent and warns to stderr;
#                         read in full before allowing.
#   @google/genai        — declares a `prepare` script whose referenced file
#                         (scripts/prepare.js) is not present in the published
#                         package, so it is a no-op; harmless to allow.
allowBuilds:
  esbuild: true
  "@swc/core": true
  "@google/genai": true
  protobufjs: true
  unrs-resolver: true
  '@biomejs/biome': true

# Single source of truth for shared dependency versions.
# Packages declare "catalog:" instead of a literal range, so a version bump
# happens here once instead of drifting across six package.json files.
catalog:
  # Toolchain
  typescript: 7.0.2
  turbo: 2.10.9
  "@biomejs/biome": 1.9.4
  "@types/node": 24.13.3
  vitest: 4.1.10
  # Held one patch behind the newest release so it clears pnpm's minimum
  # release age gate; a version published hours ago is exactly what a
  # compromised-package window looks like.
  tsx: 4.23.9

  # SWC compiles the API's decorators with `emitDecoratorMetadata`, which
  # esbuild — and therefore Vitest's default transform — does not implement.
  # Without it Nest's dependency injection has no constructor parameter types
  # to read and every provider fails to resolve.
  "@swc/core": 1.15.47
  "@swc-node/register": 1.12.1
  unplugin-swc: 1.5.10
  supertest: 7.2.2
  "@types/supertest": 7.2.1

  # Runtime
  zod: 4.4.3
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  postgres: 3.4.9
  uuidv7: 1.2.1

  # API
  # 11.1.29 was published today; pnpm's minimum release age gate exists to keep
  # a just-published version out, and one patch back costs nothing.
  "@nestjs/common": 11.1.28
  "@nestjs/core": 11.1.28
  "@nestjs/platform-express": 11.1.28
  "@nestjs/testing": 11.1.28
  "@nestjs/terminus": 11.1.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  # ioredis 6 is ten days old and BullMQ — which arrives in Phase 15 and is the
  # only reason Redis is here at all — is built against the 5.x line. Two
  # majors of the same client in one process is not worth it for a PING.
  ioredis: 5.11.1

  # AI
  "@google/genai": 2.16.0

# vite declares tsx as an *optional* peer dependency, so with autoInstallPeers
# pnpm pulls whatever the newest release is into every package that uses
# vitest — including releases published hours ago, which is exactly what
# pnpm's minimum release age gate exists to keep out. One pinned version
# instead of three.
overrides:
  tsx: 4.23.9
