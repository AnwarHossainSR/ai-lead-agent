packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for shared dependency versions.
# Packages declare "catalog:" instead of a literal range, so a version bump
# happens here once instead of drifting across six package.json files.
catalog:
  # Toolchain
  # TypeScript is held at 5.9.x on purpose: typescript-eslint declares
  # "typescript >=4.8.4 <6.1.0", so TypeScript 7 (the native port) breaks
  # linting. Revisit when typescript-eslint ships TypeScript 7 support.
  typescript: 5.9.3
  turbo: 2.10.9
  prettier: 3.9.6
  eslint: 10.8.1
  "@eslint/js": 10.0.1
  typescript-eslint: 8.66.0
  eslint-config-prettier: 10.1.8
  globals: 17.9.0
  "@types/node": 24.13.3

  # Runtime
  zod: 4.4.3
